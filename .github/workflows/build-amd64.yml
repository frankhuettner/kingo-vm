# Builds the Windows/Intel (amd64) image natively with KVM on a GitHub-hosted
# runner (~30-45 min), so you never need x86 hardware yourself. The arm64
# image builds natively on your Apple-Silicon Mac with ./build/build.sh arm64.
name: build-amd64-image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Build image
        run: ./build/build.sh amd64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kingo-win-amd64
          path: |
            dist/kingo-win-amd64.ova
            dist/KINGO-SETUP-WINDOWS.bat
            dist/SHA256SUMS.txt
          retention-days: 14
