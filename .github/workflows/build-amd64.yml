# Builds the Windows/Intel (amd64) image natively with KVM on a GitHub-hosted
# runner (~30-45 min), so you never need x86 hardware yourself. The arm64
# image builds natively on your Apple-Silicon Mac with ./build/build.sh arm64.
#
# ubuntu-latest runners have ONE 74 GB root disk with only ~14 GB free —
# /mnt is NOT a separate scratch disk anymore — so the first step deletes
# ~35 GB of preinstalled toolchains the build doesn't need (peak usage is
# ~34 GB while the grown qcow2 and the streamOptimized vmdk coexist).
#
# The result is published to a GitHub RELEASE, not an Actions artifact:
# private repos only include 500 MB of artifact storage, while release assets
# are free but capped at 2 GiB per file, so the OVA is split into parts.
# Reassemble after download:  cat kingo-win-amd64.ova.part* > kingo-win-amd64.ova
name: build-amd64-image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free ~35 GB of preinstalled software
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache \
            /usr/local/.ghcup /usr/share/swift /usr/lib/jvm /usr/share/miniconda \
            /usr/local/share/powershell /usr/local/share/chromium /usr/lib/google-cloud-sdk
          sudo docker system prune -af > /dev/null 2>&1 || true
          sudo apt-get clean
          df -h /

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Build image
        run: ./build/build.sh amd64

      - name: Publish to release (split into <2 GiB parts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          df -h /
          cd dist
          split -b 1900m -d kingo-win-amd64.ova kingo-win-amd64.ova.part
          rm kingo-win-amd64.ova
          sha256sum kingo-win-amd64.ova.part* KINGO-SETUP-WINDOWS.bat > SHA256SUMS.txt
          tag="win-amd64-r${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "Windows amd64 image (build $GITHUB_RUN_NUMBER)" \
            --notes "Download all parts plus the .bat, then reassemble the OVA with:
          \`cat kingo-win-amd64.ova.part* > kingo-win-amd64.ova\`
          Verify with \`shasum -a 256 -c SHA256SUMS.txt\` (parts, before reassembly)." \
            kingo-win-amd64.ova.part* KINGO-SETUP-WINDOWS.bat SHA256SUMS.txt
